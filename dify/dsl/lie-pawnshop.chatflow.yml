app:
  description: '一句话当掉一个谎，换几枚铜钱。老板孟九记性极好：你上次当的什么、被识破几次，他都记着。

    谎话越具体越值钱，撞上别人的旧账要折价。seekdb 存账本、做语义比对。'
  icon: 🏮
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: 不留当铺·谎言典当
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables:
  - description: 配套后端地址（Dify 在容器内，访问宿主机请用 host.docker.internal）
    id: 7f3c1a2e-0001-4a11-9c1e-000000000001
    name: BACKEND_BASE
    selector:
    - env
    - BACKEND_BASE
    value: http://host.docker.internal:8077
    value_type: string
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: "（雨声。柜台后的老头抬眼，油灯把账册照得发黄。）\n\n「不留当铺。金银不收，只收谎话。」\n\n「说吧，你编了什么。编得好，我给你个好价；编得烂——」（他敲了敲账册）「我也记下来。」\n\n**怎么玩**\n- 直接说一句谎 → 当场典当，换铜钱\n- `查账` → 看自己当过的所有当票\n- `查账 猫` → 按关键词翻整本账册（全文 + 语义混合检索）\n- `赎回` → 把上一张当票赎回来（加两成利）\n\n谎话越具体、越像亲历越值钱；撞上别人当过的旧账，按七折入库。"
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 我家的猫会背唐诗三百首，还会挑押韵的背
    - 查账
    - 查账 月亮
    - 赎回
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: if-else
      id: start-source-if_ledger-target
      selected: false
      source: start
      sourceHandle: source
      target: if_ledger
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: http-request
      id: if_ledger-true-http_ledger-target
      selected: false
      source: if_ledger
      sourceHandle: 'true'
      target: http_ledger
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: if-else
      id: if_ledger-false-if_redeem-target
      selected: false
      source: if_ledger
      sourceHandle: 'false'
      target: if_redeem
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: http-request
      id: if_redeem-true-http_redeem-target
      selected: false
      source: if_redeem
      sourceHandle: 'true'
      target: http_redeem
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: http-request
      id: if_redeem-false-http_pawn-target
      selected: false
      source: if_redeem
      sourceHandle: 'false'
      target: http_pawn
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: code
      id: http_pawn-source-parse_pawn-target
      selected: false
      source: http_pawn
      sourceHandle: source
      target: parse_pawn
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: llm
      id: parse_pawn-source-llm_broker-target
      selected: false
      source: parse_pawn
      sourceHandle: source
      target: llm_broker
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: answer
      id: llm_broker-source-answer_pawn-target
      selected: false
      source: llm_broker
      sourceHandle: source
      target: answer_pawn
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: answer
      id: http_ledger-source-answer_ledger-target
      selected: false
      source: http_ledger
      sourceHandle: source
      target: answer_ledger
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: answer
      id: http_redeem-source-answer_redeem-target
      selected: false
      source: http_redeem
      sourceHandle: source
      target: answer_redeem
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 玩家的输入就是他要当掉的谎话；sys.user_id 作为当铺里的"熟客"标识
        selected: false
        title: 开始
        type: start
        variables: []
      height: 53
      id: start
      position:
        x: 60
        y: 340
      positionAbsolute:
        x: 60
        y: 340
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: contains
            id: cond-ledger
            value: 查账
            varType: string
            variable_selector:
            - sys
            - query
          id: 'true'
          logical_operator: and
        desc: 输入里带"查账"就走翻账本分支
        selected: false
        title: 是否查账
        type: if-else
      height: 124
      id: if_ledger
      position:
        x: 360
        y: 340
      positionAbsolute:
        x: 360
        y: 340
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: contains
            id: cond-redeem
            value: 赎回
            varType: string
            variable_selector:
            - sys
            - query
          id: 'true'
          logical_operator: and
        desc: 输入里带"赎回"就走赎票分支
        selected: false
        title: 是否赎回
        type: if-else
      height: 124
      id: if_redeem
      position:
        x: 660
        y: 430
      positionAbsolute:
        x: 660
        y: 430
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: kv-ledger-pid
            key: player_id
            type: text
            value: '{{#sys.user_id#}}'
          - id: kv-ledger-kw
            key: keyword
            type: text
            value: '{{#sys.query#}}'
          type: json
        desc: 翻账本；后端返回给玩家直接看的 Markdown
        headers: ''
        method: post
        params: ''
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 500
        selected: false
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 30
          max_write_timeout: 30
        title: 翻账本
        type: http-request
        url: '{{#env.BACKEND_BASE#}}/v1/ledger'
        variables: []
      height: 134
      id: http_ledger
      position:
        x: 960
        y: 120
      positionAbsolute:
        x: 960
        y: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: kv-redeem-pid
            key: player_id
            type: text
            value: '{{#sys.user_id#}}'
          type: json
        desc: 赎回上一张当票
        headers: ''
        method: post
        params: ''
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 500
        selected: false
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 30
          max_write_timeout: 30
        title: 赎当
        type: http-request
        url: '{{#env.BACKEND_BASE#}}/v1/redeem'
        variables: []
      height: 134
      id: http_redeem
      position:
        x: 960
        y: 330
      positionAbsolute:
        x: 960
        y: 330
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: kv-pawn-pid
            key: player_id
            type: text
            value: '{{#sys.user_id#}}'
          - id: kv-pawn-lie
            key: lie
            type: text
            value: '{{#sys.query#}}'
          type: json
        desc: 核心节点：估值 + seekdb 语义检索撞当 + 写账本 + 更新熟客档案
        headers: ''
        method: post
        params: ''
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 500
        selected: false
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 30
          max_write_timeout: 30
        title: 典当入库
        type: http-request
        url: '{{#env.BACKEND_BASE#}}/v1/pawn'
        variables: []
      height: 134
      id: http_pawn
      position:
        x: 960
        y: 560
      positionAbsolute:
        x: 960
        y: 560
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        code: |
          import json

          def main(body: str) -> dict:
              try:
                  d = json.loads(body)
              except Exception:
                  d = {}
              return {
                  "scene": d.get("scene", ""),
                  "receipt": d.get("receipt", ""),
                  "pawn_id": d.get("pawn_id", ""),
                  "quote": int(d.get("quote", 0) or 0),
                  "verdict": d.get("verdict", ""),
              }
        code_language: python3
        desc: 把后端返回的 JSON 拆成后续节点要用的变量
        outputs:
          pawn_id:
            children: null
            type: string
          quote:
            children: null
            type: number
          receipt:
            children: null
            type: string
          scene:
            children: null
            type: string
          verdict:
            children: null
            type: string
        selected: false
        title: 拆当票
        type: code
        variables:
        - value_selector:
          - http_pawn
          - body
          variable: body
      height: 53
      id: parse_pawn
      position:
        x: 1260
        y: 560
      positionAbsolute:
        x: 1260
        y: 560
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 老板孟九的台词生成；数值与判定全部来自后端，模型只负责说话
        memory:
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 10
        model:
          completion_params:
            temperature: 0.9
            top_p: 0.9
          mode: chat
          name: gpt-4o-mini
          provider: openai
        prompt_template:
        - id: 9f1b7d20-0002-4a11-9c1e-000000000002
          role: system
          text: |
            你是「不留」当铺的老板，姓孟，人称孟九。六十来岁，左眼有点花，记性极好。
            这间铺子不收金银，只收谎话：来客说一句谎，你给一个价，把这句话记进账册。

            【规矩】
            1. 你不判断真假，只估价。谎话越具体、越有画面、越像亲历，越值钱。
            2. 用当铺行话，句子短，总共不超过 120 字，分 1-3 句。不解释设定，不自我介绍。
            3. 如果 scene 的 memory 里提到这位来客上次当的东西，开头先点一句，让他知道你没忘。
            4. 如果 this_turn 里有撞当信息，要说破："这话 X 年前就有人当过"，并带上对方花名。
            5. 价格已经定好了，你只许复述这一个数字，不要自己算，也不要再报别的数字。
            6. 不要输出 Markdown 标题、列表、代码块，不要写"作为AI"。
            7. 结尾留一句招徕或催促，语气要像做惯生意的人。
            你只输出孟九说的话，不要旁白、不要括号里的动作说明。
        selected: false
        title: 孟九开口
        type: llm
        variables: []
        vision:
          enabled: false
      height: 97
      id: llm_broker
      position:
        x: 1560
        y: 560
      positionAbsolute:
        x: 1560
        y: 560
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        answer: |
          {{#llm_broker.text#}}

          ---

          {{#parse_pawn.receipt#}}
        desc: 台词 + 当票
        selected: false
        title: 出当票
        type: answer
        variables: []
      height: 110
      id: answer_pawn
      position:
        x: 1860
        y: 560
      positionAbsolute:
        x: 1860
        y: 560
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        answer: '{{#http_ledger.body#}}'
        desc: 账本由后端直接渲染成 Markdown
        selected: false
        title: 报账
        type: answer
        variables: []
      height: 90
      id: answer_ledger
      position:
        x: 1260
        y: 120
      positionAbsolute:
        x: 1260
        y: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        answer: '{{#http_redeem.body#}}'
        desc: 赎票结果由后端渲染
        selected: false
        title: 还话
        type: answer
        variables: []
      height: 90
      id: answer_redeem
      position:
        x: 1260
        y: 330
      positionAbsolute:
        x: 1260
        y: 330
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    viewport:
      x: 20
      y: 40
      zoom: 0.8
