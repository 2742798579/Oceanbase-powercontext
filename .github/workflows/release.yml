name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  release-build:
    uses: ./.github/workflows/upgrade-release.yml
    with:
      release: true
      selection: automatic

  pypi-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: release-build
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  release-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: release-build
    permissions:
      contents: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-dists
          path: dist/

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*
          fail_on_unmatched_files: true

  release-verify:
    needs: [pypi-publish, release-assets]
    permissions:
      contents: read
    uses: ./.github/workflows/release-verify.yml
    with:
      release_tag: ${{ github.event.release.tag_name }}
      release_package: powercontext

  deploy-website:
    needs: pypi-publish
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Set up website tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Cache website dependencies
        uses: ./.github/actions/cache-pnpm
        with:
          working-directory: website
          cache-dependency-glob: website/pnpm-lock.yaml

      - name: Build website
        run: make docs-build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
